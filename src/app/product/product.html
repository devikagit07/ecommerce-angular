<div class="container-fluid px-4 py-4">
  <div class="text-center mb-5">
    <h1 class="display-4 fw-bold text-primary">Our Products</h1>
    <p class="lead text-muted">Discover our amazing collection</p>
  </div>
  
  <div class="row g-4">
    @for(item of products; track item.id) {
      <div class="col-lg-3 col-md-4 col-sm-6">
        <div class="card h-100 shadow-sm border-0 product-card">
          <div class="position-relative overflow-hidden">
            <img [src]="item.image" >
                
          </div>
          <div class="card-body d-flex flex-column p-3">
            <h6 class="card-title fw-semibold mb-2" style="height: 48px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;">{{item.title}}</h6>
            <p class="card-text text-muted small mb-3" style="height: 60px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;">{{item.description}}</p>
            <div class="mt-auto">
              <div class="d-flex justify-content-between align-items-center mb-3">
                <span class="h5 text-success fw-bold mb-0">${{item.price}}</span>
                <small class="text-muted">⭐ 4.5</small>
              </div>
              <div class="d-grid gap-2">
                <a [routerLink]="['/singleview-list', item.id]" class="btn btn-outline-primary btn-sm">Quick View</a>
                <a [routerLink]="['/singleview-list', item.id]" class="btn btn-primary btn-sm">View Details</a>
              </div>
            </div>
          </div>
        </div>
      </div>
    }
  </div>
</div>
